[project]
name = "appstore-connect-mcp"
version = "0.1.0"
description = "MCP server for a focused subset of the Apple App Store Connect API: apps, provisioning, TestFlight, and app-store-version submission."
authors = [
    { name = "Jan Ivan Simoy", email = "jimsimoy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "mcp>=2.0.0",
    "pyjwt[crypto]>=2.9",
]

[project.scripts]
appstore-connect-mcp = "appstore_connect_mcp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
